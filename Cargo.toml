[package]
name = "twinfile-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
percent-encoding = "2"
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
tokio = { version = "1", features = ["rt", "time", "macros"] }
httpdate = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
trash = "5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
encoding_rs = "0.8"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
apk-info-axml = "=1.1.1"
apk-info-xml = "=1.1.1"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = true
lto = "thin"
